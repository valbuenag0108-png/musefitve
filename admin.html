<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musefitve | Panel SKU 2.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --primary: #111; --accent: #25D366; --bg: #f4f7f6; --blue: #2196F3; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); padding: 40px 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h1 { text-align: center; margin-bottom: 30px; color: var(--primary); }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 14px; }
        textarea, .full-width { grid-column: 1 / -1; }
        
        .btn-main { background: var(--primary); color: #fff; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 14px; }
        .btn-main:hover { background: #333; }
        
        .box-sku { grid-column: 1 / -1; background: #f9f9f9; padding: 20px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 10px; }
        .sku-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #ddd; }
        .sku-row input { width: 100px; padding: 8px; text-align: center; }

        .inventory-list { margin-top: 40px; border-top: 2px solid #eee; padding-top: 30px; }
        .item-card { background: #f9f9f9; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #eee; }
        .item-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .item-img { width: 65px; height: 65px; object-fit: cover; border-radius: 10px; }
        
        .variant-manager { background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #e2e2e2; }
        .variant-line { display: flex; justify-content: space-between; align-items: center; padding: 8px 5px; border-bottom: 1px solid #f5f5f5; font-size: 13px; }
        .variant-line:last-child { border: none; }
        
        .btn-sm { padding: 4px 10px; font-size: 11px; background: #ff9800; border: none; color: white; border-radius: 4px; cursor: pointer; }
        .btn-editar { background: var(--blue); padding: 8px 15px; font-size: 12px; color: white; border-radius: 6px; border: none; cursor: pointer;}
        .btn-borrar { background: #d32f2f; padding: 8px 15px; font-size: 12px; color: white; border-radius: 6px; border: none; cursor: pointer;}
    </style>
</head>
<body>

    <div class="container">
        <h1>📦 Panel SKU Inteligente Musefitve</h1>
        
        <div id="zonaFormulario">
            <h2 id="tituloFormulario" style="margin-bottom: 15px; font-size: 18px; color: #555;">Subir Nueva Prenda</h2>
            <form id="formPrenda" onsubmit="procesarFormulario(event)">
                <div class="form-grid">
                    <input type="text" id="pTitulo" placeholder="Nombre (Ej. Top Halter Sleek)" required>
                    <input type="number" id="pPrecio" placeholder="Precio en $" step="0.01" required>
                    
                    <select id="pCategoria" required>
                        <option value="" disabled selected>Selecciona Categoría...</option>
                        <option value="tops">Tops</option>
                        <option value="camisetas">Camisetas</option>
                        <option value="jackets">Jackets</option>
                        <option value="shorts">Shorts</option>
                        <option value="leggins">Leggins</option>
                        <option value="conjuntos">Conjuntos</option>
                    </select>
                    
                    <input type="text" id="pBadge" placeholder="Etiqueta opcional (Ej: Nuevo, Bestseller, Oferta o dejar vacío)">
                    
                    <input type="text" id="pImagenes" class="full-width" placeholder="Links de ImgBB separados por coma" required>
                    <textarea id="pDesc" rows="2" placeholder="Descripción de la prenda" required></textarea>

                    <div class="box-sku">
                        <p style="font-size: 13px; font-weight: 600; margin-bottom: 10px; color:#555;">⚙️ Matriz de Atributos</p>
                        <input type="text" id="pTallas" placeholder="Tallas fijas (Ej: S, M, L)" style="margin-bottom: 10px;" required>
                        <input type="text" id="pColores" placeholder="Colores fijos (Ej: Negro, Marron)" style="margin-bottom: 15px;" required>
                        <button type="button" class="btn-main" style="background:#555; padding:8px;" onclick="generarCamposStock()">Generar Combinaciones de Stock</button>
                        
                        <div id="contenedorCamposSKU" style="margin-top: 15px;"></div>
                    </div>
                </div>
                
                <button type="submit" id="btnSubmitForm" class="btn-main">➕ Guardar Prenda en Internet</button>
                <button type="button" id="btnCancelarEdicion" class="btn-main" style="background:#eee; color:#333; margin-top:10px; display:none;" onclick="cancelarEdicion()">❌ Cancelar Edición</button>
            </form>
        </div>

        <div class="inventory-list">
            <h2 style="margin-bottom: 20px; font-size: 18px; text-align: center; color:#555;">Inventario Controlado por SKU</h2>
            <div id="listaInventario">Cargando inventario...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://musefitve-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('productos');

        let idProductoEnEdicion = null;

        function generarCamposStock(valoresPreestablecidos = null) {
            const tallas = document.getElementById('pTallas').value.split(',').map(s => s.trim()).filter(s => s !== "");
            const colores = document.getElementById('pColores').value.split(',').map(s => s.trim()).filter(s => s !== "");
            const container = document.getElementById('contenedorCamposSKU');
            container.innerHTML = '';

            if(tallas.length === 0 || colores.length === 0) {
                alert("Por favor, ingresa al menos una Talla y un Color.");
                return;
            }

            tallas.forEach(t => {
                colores.forEach(c => {
                    const skuKey = `${t} - ${c}`;
                    const stockValue = valoresPreestablecidos ? (valoresPreestablecidos[skuKey] || 0) : '';
                    
                    container.innerHTML += `
                        <div class="sku-row">
                            <span style="font-size:13px; font-weight:500;">🔹 Talla ${t} | Color ${c}</span>
                            <input type="number" class="input-sku-value" data-sku="${skuKey}" value="${stockValue}" placeholder="Cant." min="0" required>
                        </div>
                    `;
                });
            });
        }

        function procesarFormulario(e) {
            e.preventDefault();
            
            const varianteInputs = document.querySelectorAll('.input-sku-value');
            let variantesObjeto = {};
            
            varianteInputs.forEach(input => {
                const key = input.getAttribute('data-sku');
                const val = parseInt(input.value || 0);
                variantesObjeto[key] = val;
            });

            const datosPrenda = {
                titulo: document.getElementById('pTitulo').value.trim(),
                precio: parseFloat(document.getElementById('pPrecio').value),
                categoria: document.getElementById('pCategoria').value,
                badge: document.getElementById('pBadge').value.trim(), // Guarda la etiqueta o el vacío
                imagenes: document.getElementById('pImagenes').value.split(',').map(s => s.trim()),
                descripcion: document.getElementById('pDesc').value.trim(),
                variantes: variantesObjeto
            };

            if (idProductoEnEdicion) {
                db.child(idProductoEnEdicion).set(datosPrenda).then(() => {
                    alert("✅ ¡Cambios guardados con éxito!");
                    cancelarEdicion();
                });
            } else {
                db.push(datosPrenda).then(() => {
                    alert("🎉 ¡Producto guardado con éxito!");
                    document.getElementById('formPrenda').reset();
                    document.getElementById('contenedorCamposSKU').innerHTML = '';
                });
            }
        }

        db.on('value', (snapshot) => {
            const data = snapshot.val();
            const lista = document.getElementById('listaInventario');
            lista.innerHTML = '';

            if (!data) {
                lista.innerHTML = '<p>No hay productos en stock.</p>';
                return;
            }

            Object.keys(data).forEach(key => {
                const prod = data[key];
                const img = prod.imagenes ? prod.imagenes[0] : '';
                const tag = (prod.badge && prod.badge !== "") ? `[${prod.badge}]` : '[Sin etiqueta]';
                
                let lineasHTML = '';
                if(prod.variantes) {
                    Object.keys(prod.variantes).forEach(vKey => {
                        const cant = prod.variantes[vKey];
                        lineasHTML += `
                            <div class="variant-line">
                                <span>👗 ${vKey}</span>
                                <span>
                                    <b style="color:${cant <= 0 ? '#d32f2f' : '#333'}">${cant} disp.</b>
                                    <button type="button" class="btn-sm" style="margin-left:10px;" onclick="restarVariante('${key}', '${vKey}', ${cant})">-1 Venta</button>
                                </span>
                            </div>
                        `;
                    });
                }

                lista.innerHTML += `
                    <div class="item-card">
                        <div class="item-header">
                            <div style="display:flex; align-items:center; gap:15px;">
                                <img src="${img}" class="item-img">
                                <div>
                                    <h3 style="font-size:16px;">${prod.titulo} <span style="font-size:12px; color:#2196F3; font-weight:normal;">${tag}</span></h3>
                                    <p style="font-size:13px; color:#666;">$${prod.precio.toFixed(2)}</p>
                                </div>
                            </div>
                            <div style="display:flex; gap:10px;">
                                <button class="btn-editar" onclick="prepararEdicion('${key}')">✏️ Editar</button>
                                <button class="btn-borrar" onclick="borrarProducto('${key}')">🗑️</button>
                            </div>
                        </div>
                        <div class="variant-manager">
                            ${lineasHTML}
                        </div>
                    </div>
                `;
            });
        });

        window.restarVariante = function(idProducto, varianteKey, stockActual) {
            if(stockActual > 0) {
                db.child(`${idProducto}/variantes/${varianteKey}`).set(stockActual - 1);
            } else {
                alert("Esta variante exacta ya está agotada.");
            }
        };

        function prepararEdicion(id) {
            db.child(id).once('value').then((snapshot) => {
                const prod = snapshot.val();
                if(!prod) return;

                idProductoEnEdicion = id;

                document.getElementById('pTitulo').value = prod.titulo;
                document.getElementById('pPrecio').value = prod.precio;
                document.getElementById('pCategoria').value = prod.categoria;
                document.getElementById('pBadge').value = prod.badge || ''; // Carga la etiqueta para borrarla si se desea
                document.getElementById('pImagenes').value = prod.imagenes.join(', ');
                document.getElementById('pDesc').value = prod.descripcion;

                let tallasSet = new Set();
                let coloresSet = new Set();
                if(prod.variantes) {
                    Object.keys(prod.variantes).forEach(k => {
                        const partes = k.split(' - ');
                        tallasSet.add(partes[0]);
                        coloresSet.add(partes[1]);
                    });
                }
                document.getElementById('pTallas').value = Array.from(tallasSet).join(', ');
                document.getElementById('pColores').value = Array.from(coloresSet).join(', ');

                generarCamposStock(prod.variantes);

                document.getElementById('tituloFormulario').innerText = "✏️ Editando: " + prod.titulo;
                document.getElementById('btnSubmitForm').innerText = "💾 Guardar Cambios SKU";
                document.getElementById('btnSubmitForm').style.background = "var(--blue)";
                document.getElementById('btnCancelarEdicion').style.display = "block";

                document.getElementById('zonaFormulario').scrollIntoView({ behavior: 'smooth' });
            });
        }

        function cancelarEdicion() {
            idProductoEnEdicion = null;
            document.getElementById('formPrenda').reset();
            document.getElementById('contenedorCamposSKU').innerHTML = '';
            document.getElementById('tituloFormulario').innerText = "Subir Nueva Prenda";
            document.getElementById('btnSubmitForm').innerText = "➕ Guardar Prenda en Internet";
            document.getElementById('btnSubmitForm').style.background = "var(--primary)";
            document.getElementById('btnCancelarEdicion').style.display = "none";
        }

        function borrarProducto(id) {
            if(confirm("¿Seguro que quieres borrar este producto SKU?")) {
                db.child(id).remove();
            }
        }
    </script>
</body>
</html>
</body>
</html>
