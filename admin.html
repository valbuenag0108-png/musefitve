<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musefitve | Panel de Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --primary: #111; --accent: #25D366; --bg: #f4f7f6; --blue: #2196F3; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); padding: 40px 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h1 { text-align: center; margin-bottom: 30px; color: var(--primary); }
        
        #zonaFormulario { scroll-margin-top: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 14px; }
        textarea { grid-column: 1 / -1; resize: vertical; }
        .full-width { grid-column: 1 / -1; }
        
        .btn-main { background: var(--primary); color: #fff; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 15px; }
        .btn-main:hover { background: #333; transform: translateY(-2px); }
        
        #btnCancelarEdicion { background: #eee; color: #333; margin-top: 10px; display: none; }
        #btnCancelarEdicion:hover { background: #ddd; }

        .inventory-list { margin-top: 40px; border-top: 2px solid #eee; padding-top: 30px; }
        .item-card { display: flex; align-items: center; justify-content: space-between; background: #f9f9f9; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #eee; }
        .item-info { display: flex; align-items: center; gap: 15px; }
        .item-img { width: 65px; height: 65px; object-fit: cover; border-radius: 10px; background: #fff; border: 1px solid #eee; }
        .item-stock { font-weight: bold; padding: 5px 12px; border-radius: 20px; background: #eee; font-size: 12px; margin-left: 5px; }
        .item-stock.low { background: #ffebee; color: #d32f2f; }
        
        .actions { display: flex; gap: 8px; }
        .actions button { width: auto; padding: 8px 15px; font-size: 12px; border-radius: 6px; }
        
        .btn-restar { background: #ff9800; }
        .btn-editar { background: var(--blue); }
        .btn-borrar { background: #d32f2f; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📦 Panel de Inventario Musefitve</h1>
        
        <div id="zonaFormulario">
            <h2 id="tituloFormulario" style="margin-bottom: 15px; font-size: 18px; color: #555;">Subir Nueva Prenda</h2>
            <form id="formPrenda" onsubmit="procesarFormulario(event)">
                <div class="form-grid">
                    <input type="text" id="pTitulo" placeholder="Nombre (Ej. Top Deportivo)" required>
                    <input type="number" id="pPrecio" placeholder="Precio en $" step="0.01" required>
                    
                    <select id="pCategoria" required>
                        <option value="" disabled selected>Selecciona Categoría...</option>
                        <option value="tops">Tops</option>
                        <option value="camisetas">Camisetas</option>
                        <option value="jackets">Jackets</option>
                        <option value="shorts">Shorts</option>
                        <option value="leggins">Leggins</option>
                        <option value="conjuntos">Conjuntos</option>
                    </select>
                    
                    <input type="number" id="pCantidad" placeholder="Cantidad en Stock (Ej. 5)" required>
                    
                    <input type="text" class="full-width" id="pBadge" placeholder="Etiqueta (Ej: Nuevo, Bestseller, Oferta o déjalo vacío para quitarlo)">
                    
                    <input type="text" class="full-width" id="pTallas" placeholder="Tallas separadas por coma (Ej. S, M, L)" required>
                    <input type="text" class="full-width" id="pColores" placeholder="Colores separados por coma (Ej. Negro, Blanco)" required>
                    <input type="text" class="full-width" id="pImagenes" placeholder="Links de ImgBB separados por coma" required>
                    
                    <textarea id="pDesc" rows="2" placeholder="Descripción de la prenda" required></textarea>
                </div>
                
                <button type="submit" id="btnSubmitForm" class="btn-main">➕ Subir Producto a la Tienda</button>
                <button type="button" id="btnCancelarEdicion" class="btn-main" onclick="cancelarEdicion()">❌ Cancelar Edición</button>
            </form>
        </div>

        <div class="inventory-list">
            <h2 style="margin-bottom: 20px; font-size: 20px; text-align: center;">Inventario Actual</h2>
            <div id="listaInventario">Cargando inventario...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://musefitve-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('productos');

        let idProductoEnEdicion = null;

        // --- MOSTRAR INVENTARIO ---
        db.on('value', (snapshot) => {
            const data = snapshot.val();
            const lista = document.getElementById('listaInventario');
            lista.innerHTML = '';

            if (!data) {
                lista.innerHTML = '<p style="text-align:center; color:#888;">No hay productos en la tienda aún.</p>';
                return;
            }

            Object.keys(data).forEach(key => {
                const prod = data[key];
                const img = (prod.imagenes && prod.imagenes[0]) ? prod.imagenes[0] : '';
                const stock = parseInt(prod.cantidad || 0);
                const stockClase = stock <= 0 ? 'low' : '';
                const textoStock = stock <= 0 ? 'Agotado' : `${stock} disp.`;
                const tagVisual = (prod.badge && prod.badge !== "") ? `[${prod.badge}]` : '[Sin etiqueta]';

                lista.innerHTML += `
                    <div class="item-card" id="card-${key}">
                        <div class="item-info">
                            <img src="${img}" class="item-img">
                            <div>
                                <h4 style="font-size: 15px;">${prod.titulo} <span style="font-size:12px; color:#2196F3; font-weight:normal;">${tagVisual}</span></h4>
                                <p style="font-size: 12px; color: #777; margin-top: 2px;">
                                    $${parseFloat(prod.precio).toFixed(2)} | 
                                    <span class="item-stock ${stockClase}">${textoStock}</span>
                                </p>
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn-restar btn-main" onclick="restarStock('${key}', ${stock})">-1 Venta</button>
                            <button class="btn-editar btn-main" onclick="prepararEdicion('${key}')">✏️ Editar</button>
                            <button class="btn-borrar btn-main" onclick="borrarProducto('${key}')">🗑️</button>
                        </div>
                    </div>
                `;
            });
        });

        // --- GUARDAR O ACTUALIZAR ---
        function procesarFormulario(e) {
            e.preventDefault();
            
            const tallasArray = document.getElementById('pTallas').value.split(',').map(s => s.trim()).filter(s => s !== "");
            const coloresArray = document.getElementById('pColores').value.split(',').map(s => s.trim()).filter(s => s !== "");
            const imagenesArray = document.getElementById('pImagenes').value.split(',').map(s => s.trim()).filter(s => s !== "");

            const datosPrenda = {
                titulo: document.getElementById('pTitulo').value.trim(),
                precio: parseFloat(document.getElementById('pPrecio').value),
                categoria: document.getElementById('pCategoria').value,
                cantidad: parseInt(document.getElementById('pCantidad').value),
                badge: document.getElementById('pBadge').value.trim(), // Aquí va tu etiqueta
                tallas: tallasArray,
                colores: coloresArray,
                imagenes: imagenesArray,
                descripcion: document.getElementById('pDesc').value.trim(),
                marca: 'Musefitve'
            };

            if (idProductoEnEdicion) {
                db.child(idProductoEnEdicion).set(datosPrenda).then(() => {
                    alert("✅ ¡Cambios guardados!");
                    cancelarEdicion();
                });
            } else {
                db.push(datosPrenda).then(() => {
                    alert("🎉 ¡Prenda subida con éxito!");
                    document.getElementById('formPrenda').reset();
                });
            }
        }

        // --- PREPARAR EDICIÓN ---
        function prepararEdicion(id) {
            db.child(id).once('value').then((snapshot) => {
                const prod = snapshot.val();
                if(!prod) return;

                idProductoEnEdicion = id;

                document.getElementById('pTitulo').value = prod.titulo;
                document.getElementById('pPrecio').value = prod.precio;
                document.getElementById('pCategoria').value = prod.categoria;
                document.getElementById('pCantidad').value = prod.cantidad;
                document.getElementById('pBadge').value = prod.badge || ''; // Carga el badge actual
                document.getElementById('pTallas').value = prod.tallas.join(', ');
                document.getElementById('pColores').value = prod.colores.join(', ');
                document.getElementById('pImagenes').value = prod.imagenes.join(', ');
                document.getElementById('pDesc').value = prod.descripcion;

                document.getElementById('tituloFormulario').innerText = "✏️ Editando: " + prod.titulo;
                document.getElementById('btnSubmitForm').innerText = "💾 Guardar Cambios";
                document.getElementById('btnSubmitForm').style.background = "var(--blue)";
                document.getElementById('btnCancelarEdicion').style.display = "block";

                document.getElementById('zonaFormulario').scrollIntoView({ behavior: 'smooth' });
            });
        }

        function cancelarEdicion() {
            idProductoEnEdicion = null;
            document.getElementById('formPrenda').reset();
            document.getElementById('tituloFormulario').innerText = "Subir Nueva Prenda";
            document.getElementById('btnSubmitForm').innerText = "➕ Subir Producto a la Tienda";
            document.getElementById('btnSubmitForm').style.background = "var(--primary)";
            document.getElementById('btnCancelarEdicion').style.display = "none";
        }

        function restarStock(id, stockActual) {
            if (stockActual > 0) {
                db.child(id).update({ cantidad: stockActual - 1 });
            } else {
                alert("Este producto ya está agotado.");
            }
        }

        function borrarProducto(id) {
            if(confirm("¿Seguro que quieres eliminar esta prenda?")) {
                db.child(id).remove();
            }
        }
    </script>
</body>
</html>
</body>
</html>
