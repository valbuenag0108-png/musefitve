<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musefitve | Tienda Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        /* [MANTÉN TUS ESTILOS AQUÍ, NO LOS CAMBIÉ] */
        :root { --primary: #111; --accent: #25D366; --bg: #ffffff; --text: #333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; }
        .product-card { border: 1px solid #eee; border-radius: 16px; padding: 15px; cursor: pointer; }
        .badge { background: #111; color: #fff; padding: 5px 10px; border-radius: 20px; font-size: 10px; }
    </style>
</head>
<body>

    <div id="catalogView">
        <header><h1>Musefit.ve</h1></header>
        <div class="container" id="productos">
            <div class="product-grid" id="gridPrendas">
                <p>Cargando colección exclusiva...</p>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://musefitve-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function cargarProductosDesdeFirebase() {
            database.ref('productos').on('value', (snapshot) => {
                const data = snapshot.val();
                const grid = document.getElementById('gridPrendas');
                grid.innerHTML = '';
                
                if (!data) {
                    grid.innerHTML = '<p>No hay productos disponibles.</p>';
                    return;
                }

                Object.keys(data).forEach((key) => {
                    const prod = data[key];
                    const etiqueta = (prod.badge && prod.badge.trim() !== "") ? `<span class="badge">${prod.badge}</span>` : '';
                    
                    grid.innerHTML += `
                        <div class="product-card" onclick="alert('Funciona!')">
                            ${etiqueta}
                            <img src="${prod.imagenes[0]}" style="width:100%">
                            <p>${prod.titulo}</p>
                            <p>$${prod.precio}</p>
                        </div>
                    `;
                });
            });
        }
        window.onload = cargarProductosDesdeFirebase;
    </script>
</body>
</html>
